<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Friends Ultimate: 2 Chapters & The Technician</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; filter: saturate(1.2) contrast(1.1); }
        
        /* DIALOGUE SYSTEM */
        #dialogue-box {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 650px; background: rgba(10, 10, 25, 0.95);
            border: 2px solid #00aaff; border-radius: 12px; padding: 15px;
            display: none; z-index: 200; box-shadow: 0 0 25px rgba(0, 170, 255, 0.4);
        }
        #tech-portrait {
            width: 55px; height: 55px; border-radius: 50%; float: left; margin-right: 15px;
            border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: bold;
        }
        #tech-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        #tech-text { font-size: 14px; color: #eee; }

        /* HUD & STATS */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; }
        .box-ui { background: rgba(0,0,0,0.85); border-left: 5px solid red; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
        #stamina-bar { width: 130px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        #stamina-fill { width: 100%; height: 100%; background: #00ff00; transition: width 0.1s; }

        /* MOBILE UI CONTROLS */
        #joystick-area { position: absolute; bottom: 50px; left: 50px; width: 110px; height: 110px; background: rgba(255,255,255,0.08); border-radius: 50%; z-index: 50; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border-radius: 50%; }
        .action-btns { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 50; }
        .m-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 9px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; }
        .m-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.9); }

        /* START OVERLAY */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 10%, rgba(0,0,0,0.9) 100%); pointer-events: none; z-index: 5; }
        button#start-btn { padding: 18px 50px; font-size: 22px; background: #ff0000; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: #ff0000; font-size: 40px; margin-bottom: 5px;">RAINBOW FRIENDS</h1>
        <p style="opacity: 0.7;">Chapter 1: Hemlock Woods | Chapter 2: Odd World</p>
        <button id="start-btn" onclick="audioControl.init()">MULAI PETUALANGAN</button>
    </div>

    <div id="dialogue-box">
        <div id="tech-portrait">?</div>
        <div id="tech-name">SISTEM</div>
        <div id="tech-text">Mempersiapkan instruksi...</div>
        <div style="font-size: 10px; color: #00ff00; margin-top: 10px; text-align: right; letter-spacing: 1px;">KLIK UNTUK LANJUT</div>
    </div>

    <div class="vignette"></div>

    <div class="hud">
        <div class="box-ui">
            <div id="info-ch" style="font-size: 10px; color: #00aaff;">CHAPTER 1</div>
            <div id="info-task" style="font-size: 16px; font-weight: bold; color: #ffff00;">MENCARI BLOK</div>
            <div id="info-count" style="font-size: 14px;">ITEM: 0 / 5</div>
        </div>
        <div class="box-ui" style="border-left-color: #00ff00;">
            <div style="font-size: 9px;">ENERGI</div>
            <div id="stamina-bar"><div id="stamina-fill"></div></div>
        </div>
    </div>

    <div id="joystick-area"><div id="joystick-knob"></div></div>
    <div class="action-btns">
        <div class="m-btn" id="btn-run" style="border-color: #ffcc00;">LARI<br>(SHIFT)</div>
        <div class="m-btn" id="btn-crouch" style="border-color: #00aaff;">JONGKOK<br>(C)</div>
        <div class="m-btn" id="btn-box" style="border-color: #ff4400; background: rgba(139, 69, 19, 0.4);">BOX<br>(SPACE)</div>
    </div>

    <canvas id="mainCanvas"></canvas>

<script>
/**
 * RAINBOW FRIENDS ULTIMATE - THE TECHNICIAN & 2 CHAPTERS EDITION
 */

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- AUDIO ENGINE ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const audioControl = {
    started: false,
    init() { if(this.started) return; audioCtx.resume(); this.started = true; game.nextLevel(); },
    playHeartbeat(vol) {
        if(Math.random() > 0.12) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(55, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        g.gain.value = vol * 0.4;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    },
    playStep(isCrouching) {
        if(isCrouching) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = 60; g.gain.value = 0.02;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    },
    playCollect() {
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        g.gain.value = 0.1;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
};

// --- LEVEL DATABASE (10 NIGHTS) ---
const LEVELS = [
    { ch: 1, speaker: "RED", task: "Cari Blok", goal: 5, mons: ["BLUE"], col: "#00f", msg: "Selamat datang di fasilitas. Kumpulkan blok untuk memperbaiki mesin utama." },
    { ch: 1, speaker: "RED", task: "Beri Makan Orange", goal: 7, mons: ["BLUE", "GREEN", "ORANGE"], col: "#f80", msg: "Orange mulai gelisah. Pastikan dispenser makanannya terisi." },
    { ch: 1, speaker: "RED", task: "Sekring Listrik", goal: 10, mons: ["BLUE", "GREEN", "PURPLE"], col: "#a0a", msg: "Sistem air rusak. Sesuatu menunggu di dalam kegelapan air." },
    { ch: 1, speaker: "RED", task: "Kumpulkan Baterai", goal: 12, mons: ["BLUE", "GREEN", "PURPLE", "ORANGE"], col: "#fff", msg: "Listrik padam total. Tanpa baterai, kamu tidak akan bisa keluar." },
    { ch: 1, speaker: "RED", task: "LARI & KABUR!", goal: 1, mons: ["BLUE"], col: "#f00", msg: "Kamu sudah melihat terlalu banyak. Selamat tinggal..." },
    
    // CHAPTER 2
    { ch: 2, speaker: "TECHNICIAN", task: "Cari Bola Lampu", goal: 10, mons: ["BLUE", "CYAN"], col: "#ff0", msg: "Halo? Ada orang di sana? Saya Teknisi di sini! Cepat kumpulkan bola lampu ini agar saya bisa menyalakan panel kontrol!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Tabung Gas", goal: 8, mons: ["BLUE", "YELLOW", "CYAN"], col: "#555", msg: "Bagus! Sekarang cari tabung gas. Hati-hati, monster kuning itu bisa terbang dan membawamu pergi!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Tangkap Lookies", goal: 15, mons: ["BLUE", "GREEN", "YELLOW", "PURPLE"], col: "#fff", isLooky: true, msg: "Lookies itu kabur ke mana-mana! Mereka mata-mata Oswald, kita harus menangkap mereka semua!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Gula Pesta", goal: 10, mons: ["BLUE", "CYAN", "YELLOW", "ORANGE", "GREEN"], col: "#eee", msg: "Kita butuh gula untuk membuat mesin pengalih perhatian. Cepat, waktu kita hampir habis!" },
    { ch: 2, speaker: "TECHNICIAN", task: "ROLLER COASTER", goal: 1, mons: ["BLUE", "GREEN", "ORANGE", "PURPLE", "YELLOW", "CYAN"], col: "#f0f", msg: "CEPAT! Naik ke Roller Coaster itu! Itulah satu-satunya jalan keluar dari Odd World!" }
];

// --- PLAYER & INPUT LOGIC ---
const joy = { active: false, dx: 0, dy: 0 };
let mRun = false, mBox = false, mCrouch = false;
const keys = {};

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

// Touch Handlers
const joyArea = document.getElementById('joystick-area');
joyArea.ontouchstart = () => joy.active = true;
window.ontouchmove = e => {
    if(!joy.active) return;
    const t = e.touches[0], r = joyArea.getBoundingClientRect();
    const cx = r.left + 55, cy = r.top + 55;
    const d = Math.min(45, Math.hypot(t.clientX - cx, t.clientY - cy));
    const ang = Math.atan2(t.clientY - cy, t.clientX - cx);
    joy.dx = Math.cos(ang) * (d/45); joy.dy = Math.sin(ang) * (d/45);
    document.getElementById('joystick-knob').style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;
};
window.ontouchend = () => { joy.active = false; joy.dx = 0; joy.dy = 0; document.getElementById('joystick-knob').style.transform = 'translate(0,0)'; };

document.getElementById('btn-run').ontouchstart = () => mRun = true; document.getElementById('btn-run').ontouchend = () => mRun = false;
document.getElementById('btn-box').ontouchstart = () => mBox = true; document.getElementById('btn-box').ontouchend = () => mBox = false;
document.getElementById('btn-crouch').ontouchstart = () => mCrouch = true; document.getElementById('btn-crouch').ontouchend = () => mCrouch = false;

class Player {
    constructor() { this.x = 2000; this.y = 2000; this.stamina = 100; this.collected = 0; }
    update() {
        this.isHiding = keys['Space'] || mBox;
        this.isCrouching = keys['KeyC'] || keys['ControlLeft'] || mCrouch;
        if(this.isHiding) return;

        let speed = 4.5;
        if(this.isCrouching) speed = 2.2;
        if((keys['ShiftLeft'] || mRun) && this.stamina > 0 && !this.isCrouching) { speed = 8.5; this.stamina -= 0.6; }
        else if(this.stamina < 100) this.stamina += 0.2;

        let mx = joy.dx * speed, my = joy.dy * speed;
        if(keys['KeyW']) my = -speed; if(keys['KeyS']) my = speed;
        if(keys['KeyA']) mx = -speed; if(keys['KeyD']) mx = speed;

        this.x += mx; this.y += my;
        if(Math.hypot(mx, my) > 0.5 && Math.random() > 0.85) audioControl.playStep(this.isCrouching);
        document.getElementById('stamina-fill').style.width = this.stamina + "%";
    }
}

class Monster {
    constructor(type) { this.type = type; this.x = Math.random()*4000; this.y = Math.random()*4000; }
    update(p) {
        const d = Math.hypot(p.x - this.x, p.y - this.y);
        const limit = p.isCrouching ? 220 : 580; // Stealth buff
        if(d < limit && !p.isHiding) {
            const a = Math.atan2(p.y - this.y, p.x - this.x);
            const s = (this.type==='ORANGE'||this.type==='CYAN') ? 6.8 : 3.8;
            this.x += Math.cos(a)*s; this.y += Math.sin(a)*s;
            audioControl.playHeartbeat(1 - (d/limit));
            if(d < 45) location.reload();
        } else { this.x += (Math.random()-0.5)*12; this.y += (Math.random()-0.5)*12; }
    }
    draw(cx, cy) {
        ctx.fillStyle = this.type.toLowerCase();
        ctx.beginPath(); ctx.arc(this.x-cx, this.y-cy, 28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff"; // Eyes
        ctx.beginPath(); ctx.arc(this.x-cx-10, this.y-cy-5, 8, 0, Math.PI*2); ctx.arc(this.x-cx+10, this.y-cy-5, 8, 0, Math.PI*2); ctx.fill();
    }
}

// --- GAME CONTROLLER ---
const game = {
    lvl: -1, active: false, player: new Player(), monsters: [], items: [],
    nextLevel() {
        this.lvl++; if(this.lvl >= LEVELS.length) { alert("KERJA BAGUS! Kamu Berhasil Kabur!"); location.reload(); return; }
        const d = LEVELS[this.lvl]; this.active = false;
        
        // Setup Dialogue UI
        const diag = document.getElementById('dialogue-box');
        const port = document.getElementById('tech-portrait');
        const name = document.getElementById('tech-name');
        
        diag.style.display = 'block';
        document.getElementById('tech-text').innerText = d.msg;
        
        if(d.speaker === "TECHNICIAN") {
            name.innerText = "THE TECHNICIAN"; name.style.color = "#00aaff";
            port.innerText = "T"; port.style.background = "#003366"; diag.style.borderColor = "#00aaff";
        } else {
            name.innerText = "RED"; name.style.color = "red";
            port.innerText = "R"; port.style.background = "#660000"; diag.style.borderColor = "red";
        }

        diag.onclick = () => { diag.style.display = 'none'; this.startLevel(); };
    },
    startLevel() {
        const d = LEVELS[this.lvl];
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('info-ch').innerText = "CHAPTER " + d.ch + (d.ch === 2 ? " - ODD WORLD" : "");
        document.getElementById('info-task').innerText = d.task;
        this.monsters = d.mons.map(m => new Monster(m));
        this.items = Array.from({length: d.goal}, () => ({x: Math.random()*4000, y: Math.random()*4000, c: false}));
        this.player.collected = 0;
        document.getElementById('info-count').innerText = "ITEM: 0 / " + d.goal;
        this.active = true;
    },
    loop() {
        if(this.active) {
            ctx.fillStyle = "#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
            const cx = this.player.x - canvas.width/2, cy = this.player.y - canvas.height/2;
            
            this.player.update();
            this.items.forEach(it => { if(!it.c) {
                ctx.fillStyle = LEVELS[this.lvl].col;
                if(LEVELS[this.lvl].isLooky) { ctx.beginPath(); ctx.arc(it.x-cx, it.y-cy, 12, 0, Math.PI*2); ctx.fill(); ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(it.x-cx, it.y-cy, 5, 0, Math.PI*2); ctx.fill(); }
                else ctx.fillRect(it.x-cx-12, it.y-cy-12, 24, 24);
                if(Math.hypot(this.player.x-it.x, this.player.y-it.y) < 45) { it.c = true; this.player.collected++; audioControl.playCollect(); document.getElementById('info-count').innerText = "ITEM: "+this.player.collected+" / "+LEVELS[this.lvl].goal; }
            }});
            
            this.monsters.forEach(m => { m.update(this.player); m.draw(cx, cy); });
            
            // Draw Player
            ctx.fillStyle = this.player.isHiding ? "#5d4037" : (this.player.isCrouching ? "#00aaff" : "#0f0");
            if(this.player.isHiding) ctx.fillRect(canvas.width/2-25, canvas.height/2-25, 50, 50);
            else { ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, this.player.isCrouching?14:22, 0, Math.PI*2); ctx.fill(); }

            if(this.player.collected >= LEVELS[this.lvl].goal) this.nextLevel();
        }
        requestAnimationFrame(() => this.loop());
    }
};

game.loop();
</script>
</body>
</html>
