<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Friends Ultimate: The Technician Edition</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; filter: saturate(1.2) contrast(1.1); }
        
        /* DIALOGUE BOX - RED & TECHNICIAN */
        #dialogue-box {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 650px; background: rgba(10, 10, 25, 0.95);
            border: 3px solid #00aaff; border-radius: 12px; padding: 15px;
            display: none; z-index: 200; box-shadow: 0 0 25px rgba(0, 170, 255, 0.4);
            cursor: pointer;
        }
        #tech-portrait {
            width: 55px; height: 55px; border-radius: 50%; float: left; margin-right: 15px;
            border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 24px;
        }
        #tech-name { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        #tech-text { font-size: 14px; color: #eee; line-height: 1.4; }

        /* HUD */
        .hud { position: absolute; top: 15px; left: 15px; z-index: 10; pointer-events: none; }
        .box-ui { background: rgba(0,0,0,0.85); border-left: 5px solid red; padding: 12px; margin-bottom: 8px; border-radius: 4px; }
        #stamina-bar { width: 130px; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-top: 5px; }
        #stamina-fill { width: 100%; height: 100%; background: #00ff00; }

        /* MOBILE CONTROLS */
        #joystick-area { position: absolute; bottom: 50px; left: 50px; width: 110px; height: 110px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 50; }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; }
        .action-btns { position: absolute; bottom: 40px; right: 30px; display: flex; flex-direction: column; gap: 12px; z-index: 50; }
        .m-btn { width: 65px; height: 65px; background: rgba(255,255,255,0.15); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; }
        
        /* OVERLAYS */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; text-align: center; }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.95) 100%); pointer-events: none; z-index: 5; }
        button#start-btn { padding: 18px 50px; font-size: 22px; background: #ff0000; color: white; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: #ff0000; font-size: 36px; margin: 0;">RAINBOW FRIENDS</h1>
        <p style="opacity: 0.7; margin-bottom: 20px;">Chapter 1 & 2: The Technician Update</p>
        <button id="start-btn" onclick="audioControl.init()">MULAI PETUALANGAN</button>
    </div>

    <div id="dialogue-box">
        <div id="tech-portrait">?</div>
        <div id="tech-name">SISTEM</div>
        <div id="tech-text">Mempersiapkan...</div>
        <div style="font-size: 9px; color: #00ff00; margin-top: 10px; text-align: right;">KLIK UNTUK LANJUT</div>
    </div>

    <div class="vignette"></div>

    <div class="hud">
        <div class="box-ui">
            <div id="info-ch" style="font-size: 10px; color: #00aaff;">CHAPTER 1</div>
            <div id="info-task" style="font-size: 16px; font-weight: bold; color: #ffff00;">LOADING...</div>
            <div id="info-count" style="font-size: 14px;">ITEM: 0 / 0</div>
        </div>
        <div class="box-ui" style="border-left-color: #00ff00;">
            <div id="stamina-bar"><div id="stamina-fill"></div></div>
        </div>
    </div>

    <div id="joystick-area"><div id="joystick-knob"></div></div>
    <div class="action-btns">
        <div class="m-btn" id="btn-run">LARI</div>
        <div class="m-btn" id="btn-crouch" style="border-color: #00aaff;">JONGKOK</div>
        <div class="m-btn" id="btn-box" style="background: rgba(139, 69, 19, 0.4);">BOX</div>
    </div>

    <canvas id="mainCanvas"></canvas>

<script>
/**
 * RAINBOW FRIENDS ULTIMATE SCRIPT
 */

const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// --- AUDIO ENGINE ---
let audioCtx;
const audioControl = {
    started: false,
    init() {
        if (this.started) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioCtx.resume().then(() => {
            this.started = true;
            this.playAmbience();
            game.nextLevel();
        });
    },
    playAmbience() {
        const node = audioCtx.createBufferSource();
        const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 0.05;
        node.buffer = buffer; node.loop = true;
        const g = audioCtx.createGain(); g.gain.value = 0.02;
        node.connect(g); g.connect(audioCtx.destination);
        node.start();
    },
    playHeartbeat(vol) {
        if(!audioCtx || Math.random() > 0.1) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = 50; g.gain.value = vol * 0.3;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    },
    playCollect() {
        if(!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.frequency.value = 900; g.gain.value = 0.1;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }
};

// --- DATA LEVEL ---
const LEVELS = [
    { ch: 1, speaker: "RED", task: "Cari Blok", goal: 5, mons: ["BLUE"], col: "#00f", msg: "Red: Selamat datang. Cepat kumpulkan blok itu sebelum Blue menemukanmu." },
    { ch: 1, speaker: "RED", task: "Beri Makan Orange", goal: 7, mons: ["BLUE", "GREEN", "ORANGE"], col: "#f80", msg: "Red: Orange sudah bangun. Jangan biarkan dia kelaparan." },
    { ch: 1, speaker: "RED", task: "Cari Sekring", goal: 10, mons: ["BLUE", "GREEN", "PURPLE"], col: "#a0a", msg: "Red: Purple bersembunyi di air. Jangan menginjak genangan." },
    { ch: 1, speaker: "RED", task: "Kumpulkan Baterai", goal: 12, mons: ["BLUE", "GREEN", "PURPLE", "ORANGE"], col: "#fff", msg: "Red: Listrik akan mati. Cari baterai sekarang!" },
    { ch: 1, speaker: "RED", task: "LARI!", goal: 1, mons: ["BLUE"], col: "#f00", msg: "Red: Waktumu habis. Selamat tinggal!" },
    
    // CHAPTER 2
    { ch: 2, speaker: "TECHNICIAN", task: "Bola Lampu", goal: 10, mons: ["BLUE", "CYAN"], col: "#ff0", msg: "The Technician: Halo! Saya terjebak di ruang kontrol. Tolong cari bola lampu agar saya bisa menyalakan lampu taman!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Tabung Gas", goal: 8, mons: ["BLUE", "YELLOW", "CYAN"], col: "#555", msg: "The Technician: Kerja bagus! Sekarang saya butuh gas. Awas, Yellow bisa terbang membawa pemain!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Tangkap Lookies", goal: 15, mons: ["BLUE", "GREEN", "YELLOW", "PURPLE"], col: "#fff", isLooky: true, msg: "The Technician: Lookies kabur! Mereka ada di mana-mana, tangkap mereka!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Gula Pesta", goal: 10, mons: ["BLUE", "CYAN", "YELLOW", "ORANGE", "GREEN"], col: "#eee", msg: "The Technician: Hampir selesai. Ambil gula ini untuk mesin penarik perhatian." },
    { ch: 2, speaker: "TECHNICIAN", task: "ROLLER COASTER", goal: 1, mons: ["BLUE", "GREEN", "ORANGE", "PURPLE", "YELLOW", "CYAN"], col: "#f0f", msg: "The Technician: CEPAT! Lompat ke Roller Coaster itu! Kita harus keluar dari sini!" }
];

// --- INPUTS ---
const joy = { active: false, dx: 0, dy: 0 };
let mRun = false, mBox = false, mCrouch = false;
const keys = {};
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

const joyArea = document.getElementById('joystick-area');
joyArea.addEventListener('touchstart', e => { joy.active = true; }, {passive: false});
window.addEventListener('touchmove', e => {
    if(!joy.active) return;
    const t = e.touches[0], r = joyArea.getBoundingClientRect();
    const cx = r.left + 55, cy = r.top + 55;
    const d = Math.min(45, Math.hypot(t.clientX - cx, t.clientY - cy));
    const ang = Math.atan2(t.clientY - cy, t.clientX - cx);
    joy.dx = Math.cos(ang) * (d/45); joy.dy = Math.sin(ang) * (d/45);
    document.getElementById('joystick-knob').style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;
}, {passive: false});
window.addEventListener('touchend', () => { joy.active = false; joy.dx = 0; joy.dy = 0; document.getElementById('joystick-knob').style.transform = 'translate(0,0)'; });

document.getElementById('btn-run').ontouchstart = (e) => { e.preventDefault(); mRun = true; };
document.getElementById('btn-run').ontouchend = () => mRun = false;
document.getElementById('btn-box').ontouchstart = (e) => { e.preventDefault(); mBox = true; };
document.getElementById('btn-box').ontouchend = () => mBox = false;
document.getElementById('btn-crouch').ontouchstart = (e) => { e.preventDefault(); mCrouch = true; };
document.getElementById('btn-crouch').ontouchend = () => mCrouch = false;

// --- CLASSES ---
class Player {
    constructor() { this.x = 2000; this.y = 2000; this.stamina = 100; this.collected = 0; }
    update() {
        this.isHiding = keys['Space'] || mBox;
        this.isCrouch = keys['KeyC'] || keys['ControlLeft'] || mCrouch;
        if(this.isHiding) return;
        let s = (this.isCrouch) ? 2.2 : (keys['ShiftLeft'] || mRun) ? 8 : 4.5;
        this.x += joy.dx * s; this.y += joy.dy * s;
        if(keys['KeyW']) this.y -= s; if(keys['KeyS']) this.y += s;
        if(keys['KeyA']) this.x -= s; if(keys['KeyD']) this.x += s;
        if(s > 5) this.stamina -= 0.5; else if(this.stamina < 100) this.stamina += 0.2;
        document.getElementById('stamina-fill').style.width = this.stamina + "%";
    }
}

class Monster {
    constructor(type) { this.type = type; this.x = Math.random()*4000; this.y = Math.random()*4000; }
    update(p) {
        const d = Math.hypot(p.x - this.x, p.y - this.y);
        const limit = p.isCrouch ? 200 : 550;
        if(d < limit && !p.isHiding) {
            const a = Math.atan2(p.y - this.y, p.x - this.x);
            const s = (this.type==='ORANGE'||this.type==='CYAN') ? 6.5 : 3.6;
            this.x += Math.cos(a)*s; this.y += Math.sin(a)*s;
            audioControl.playHeartbeat(1-(d/limit));
            if(d < 45) location.reload();
        } else { this.x += (Math.random()-0.5)*10; this.y += (Math.random()-0.5)*10; }
    }
    draw(cx, cy) {
        ctx.fillStyle = this.type.toLowerCase();
        ctx.beginPath(); ctx.arc(this.x-cx, this.y-cy, 28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(this.x-cx-10, this.y-cy-5, 8, 0, Math.PI*2); ctx.arc(this.x-cx+10, this.y-cy-5, 8, 0, Math.PI*2); ctx.fill();
    }
}

const game = {
    lvl: -1, active: false, player: new Player(), monsters: [], items: [],
    nextLevel() {
        this.lvl++; if(this.lvl >= LEVELS.length) { alert("TAMAT!"); location.reload(); return; }
        const d = LEVELS[this.lvl]; this.active = false;
        
        const diag = document.getElementById('dialogue-box');
        diag.style.display = 'block';
        document.getElementById('tech-text').innerText = d.msg;
        document.getElementById('tech-name').innerText = d.speaker === "TECHNICIAN" ? "THE TECHNICIAN" : "RED";
        document.getElementById('tech-name').style.color = d.speaker === "TECHNICIAN" ? "#00aaff" : "red";
        document.getElementById('tech-portrait').innerText = d.speaker[0];
        document.getElementById('tech-portrait').style.background = d.speaker === "TECHNICIAN" ? "#003366" : "#660000";
        diag.onclick = () => { diag.style.display = 'none'; this.startLevel(); };
    },
    startLevel() {
        const d = LEVELS[this.lvl];
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('info-ch').innerText = "CHAPTER " + d.ch;
        document.getElementById('info-task').innerText = d.task;
        this.monsters = d.mons.map(m => new Monster(m));
        this.items = Array.from({length: d.goal}, () => ({x: Math.random()*4000, y: Math.random()*4000, c: false}));
        this.player.collected = 0;
        document.getElementById('info-count').innerText = "ITEM: 0 / " + d.goal;
        this.active = true;
    },
    loop() {
        if(this.active) {
            ctx.fillStyle = "#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
            const cx = this.player.x - canvas.width/2, cy = this.player.y - canvas.height/2;
            this.player.update();
            this.items.forEach(it => { if(!it.c) {
                ctx.fillStyle = LEVELS[this.lvl].col;
                ctx.fillRect(it.x-cx-12, it.y-cy-12, 24, 24);
                if(Math.hypot(this.player.x-it.x, this.player.y-it.y) < 45) { it.c = true; this.player.collected++; audioControl.playCollect(); document.getElementById('info-count').innerText = "ITEM: "+this.player.collected+" / "+LEVELS[this.lvl].goal; }
            }});
            this.monsters.forEach(m => { m.update(this.player); m.draw(cx, cy); });
            ctx.fillStyle = this.player.isHiding ? "#5d4037" : (this.player.isCrouch ? "#00aaff" : "#0f0");
            if(this.player.isHiding) ctx.fillRect(canvas.width/2-25, canvas.height/2-25, 50, 50);
            else { ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, this.player.isCrouch?14:22, 0, Math.PI*2); ctx.fill(); }
            if(this.player.collected >= LEVELS[this.lvl].goal) this.nextLevel();
        }
        requestAnimationFrame(() => this.loop());
    }
};

game.loop();
</script>
</body>
</html>
