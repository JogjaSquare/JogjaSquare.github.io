<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Friends Ultimate FIX</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; filter: saturate(1.2); }
        
        /* DIALOGUE BOX */
        #dialogue-box {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 600px; background: rgba(10, 10, 30, 0.95);
            border: 3px solid #00aaff; border-radius: 10px; padding: 15px;
            display: none; z-index: 200; cursor: pointer;
        }
        #tech-name { font-weight: bold; color: #00aaff; margin-bottom: 5px; }

        /* HUD */
        .hud { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        .box-ui { background: rgba(0,0,0,0.8); border-left: 5px solid red; padding: 10px; margin-bottom: 5px; }
        #stamina-bar { width: 100px; height: 8px; background: #333; margin-top: 5px; }
        #stamina-fill { width: 100%; height: 100%; background: #00ff00; }

        /* CONTROLS */
        #joystick-area { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 50; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; }
        .action-btns { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
        .m-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-align: center; }

        /* START SCREEN */
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; }
        button#start-btn { padding: 20px 40px; font-size: 20px; background: red; color: white; border: none; font-weight: bold; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: red;">RAINBOW FRIENDS</h1>
        <button id="start-btn">MULAI PETUALANGAN</button>
    </div>

    <div id="dialogue-box">
        <div id="tech-name">SISTEM</div>
        <div id="tech-text">Pesan masuk...</div>
        <div style="font-size: 10px; color: #0f0; margin-top: 10px;">KLIK DI SINI UNTUK LANJUT</div>
    </div>

    <div class="hud">
        <div class="box-ui">
            <div id="info-ch" style="font-size: 10px;">CHAPTER 1</div>
            <div id="info-task" style="font-weight: bold; color: yellow;">LOADING...</div>
            <div id="info-count">ITEM: 0 / 0</div>
        </div>
        <div class="box-ui"><div id="stamina-bar"><div id="stamina-fill"></div></div></div>
    </div>

    <div id="joystick-area"><div id="joystick-knob"></div></div>
    <div class="action-btns">
        <div class="m-btn" id="btn-run">RUN</div>
        <div class="m-btn" id="btn-crouch">JONGKOK</div>
        <div class="m-btn" id="btn-box">BOX</div>
    </div>

    <canvas id="mainCanvas"></canvas>

<script>
// --- KONFIGURASI GAME ---
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let audioCtx;
const joy = { active: false, dx: 0, dy: 0 };
let mRun = false, mBox = false, mCrouch = false;
const keys = {};

// --- FIX START ENGINE ---
document.getElementById('start-btn').addEventListener('click', function() {
    // Jalankan audio jika didukung, tapi jangan jadikan penghambat
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) {}
    
    document.getElementById('overlay').style.display = 'none';
    game.nextLevel(); // Langsung pindah ke level
});

const LEVELS = [
    { ch: 1, speaker: "RED", task: "Cari Blok", goal: 5, mons: ["BLUE"], col: "#00f", msg: "Red: Cepat kumpulkan blok sebelum Blue menangkapmu." },
    { ch: 2, speaker: "TECHNICIAN", task: "Bola Lampu", goal: 10, mons: ["BLUE", "CYAN"], col: "#ff0", msg: "The Technician: Halo! Tolong cari bola lampu di Odd World!" }
];

// --- KONTROL ---
window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

document.getElementById('joystick-area').addEventListener('touchstart', e => { joy.active = true; });
window.addEventListener('touchmove', e => {
    if(!joy.active) return;
    const t = e.touches[0], r = document.getElementById('joystick-area').getBoundingClientRect();
    const cx = r.left + 50, cy = r.top + 50;
    const d = Math.min(40, Math.hypot(t.clientX - cx, t.clientY - cy));
    const ang = Math.atan2(t.clientY - cy, t.clientX - cx);
    joy.dx = Math.cos(ang) * (d/40); joy.dy = Math.sin(ang) * (d/40);
    document.getElementById('joystick-knob').style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;
});
window.addEventListener('touchend', () => { joy.active = false; joy.dx = 0; joy.dy = 0; document.getElementById('joystick-knob').style.transform = 'translate(0,0)'; });

document.getElementById('btn-run').ontouchstart = (e) => { e.preventDefault(); mRun = true; };
document.getElementById('btn-run').ontouchend = () => mRun = false;
document.getElementById('btn-crouch').ontouchstart = (e) => { e.preventDefault(); mCrouch = true; };
document.getElementById('btn-crouch').ontouchend = () => mCrouch = false;
document.getElementById('btn-box').ontouchstart = (e) => { e.preventDefault(); mBox = true; };
document.getElementById('btn-box').ontouchend = () => mBox = false;

// --- GAME LOGIC ---
class Player {
    constructor() { this.x = 2000; this.y = 2000; this.stamina = 100; this.collected = 0; }
    update() {
        this.isHiding = keys['Space'] || mBox;
        this.isCrouch = keys['KeyC'] || mCrouch;
        if(this.isHiding) return;
        let s = this.isCrouch ? 2 : (keys['ShiftLeft'] || mRun) ? 8 : 4;
        this.x += (joy.dx || (keys['KeyD']?1:0) - (keys['KeyA']?1:0)) * s;
        this.y += (joy.dy || (keys['KeyS']?1:0) - (keys['KeyW']?1:0)) * s;
        if(s > 5) this.stamina -= 0.5; else if(this.stamina < 100) this.stamina += 0.2;
        document.getElementById('stamina-fill').style.width = this.stamina + "%";
    }
}

class Monster {
    constructor(type) { this.type = type; this.x = Math.random()*4000; this.y = Math.random()*4000; }
    update(p) {
        const d = Math.hypot(p.x - this.x, p.y - this.y);
        const limit = p.isCrouch ? 200 : 500;
        if(d < limit && !p.isHiding) {
            const a = Math.atan2(p.y - this.y, p.x - this.x);
            this.x += Math.cos(a)*3.5; this.y += Math.sin(a)*3.5;
            if(d < 40) location.reload(); 
        } else { this.x += (Math.random()-0.5)*10; this.y += (Math.random()-0.5)*10; }
    }
}

const game = {
    lvl: -1, active: false, player: new Player(), monsters: [], items: [],
    nextLevel() {
        this.lvl++;
        if(this.lvl >= LEVELS.length) { alert("TAMAT!"); location.reload(); return; }
        const d = LEVELS[this.lvl];
        this.active = false;
        
        const diag = document.getElementById('dialogue-box');
        diag.style.display = 'block';
        document.getElementById('tech-text').innerText = d.msg;
        document.getElementById('tech-name').innerText = d.speaker;
        
        diag.onclick = () => {
            diag.style.display = 'none';
            this.startLevel();
        };
    },
    startLevel() {
        const d = LEVELS[this.lvl];
        this.monsters = d.mons.map(m => new Monster(m));
        this.items = Array.from({length: d.goal}, () => ({x: Math.random()*4000, y: Math.random()*4000, c: false}));
        this.player.collected = 0;
        document.getElementById('info-ch').innerText = "CHAPTER " + d.ch;
        document.getElementById('info-task').innerText = d.task;
        document.getElementById('info-count').innerText = "ITEM: 0 / " + d.goal;
        this.active = true;
    },
    loop() {
        if(this.active) {
            ctx.fillStyle = "#050505"; ctx.fillRect(0,0,canvas.width,canvas.height);
            const cx = this.player.x - canvas.width/2, cy = this.player.y - canvas.height/2;
            
            this.player.update();
            this.items.forEach(it => { if(!it.c) {
                ctx.fillStyle = LEVELS[this.lvl].col;
                ctx.fillRect(it.x-cx-10, it.y-cy-10, 20, 20);
                if(Math.hypot(this.player.x-it.x, this.player.y-it.y) < 40) {
                    it.c = true; this.player.collected++;
                    document.getElementById('info-count').innerText = "ITEM: "+this.player.collected+" / "+LEVELS[this.lvl].goal;
                }
            }});
            
            this.monsters.forEach(m => { 
                m.update(this.player); 
                ctx.fillStyle = m.type.toLowerCase();
                ctx.beginPath(); ctx.arc(m.x-cx, m.y-cy, 25, 0, Math.PI*2); ctx.fill();
            });

            ctx.fillStyle = this.player.isHiding ? "#5d4" : (this.player.isCrouch ? "#0af" : "#0f0");
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, this.player.isCrouch?12:20, 0, Math.PI*2); ctx.fill();

            if(this.player.collected >= LEVELS[this.lvl].goal) this.nextLevel();
        }
        requestAnimationFrame(() => this.loop());
    }
};

game.loop();
</script>
</body>
</html>
