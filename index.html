<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Friends: The Real 3D Experience</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <div id="overlay">
            <h1 class="horror-text">RAINBOW FRIENDS</h1>
            <p>ADVANCED 3D ENGINE v2.0</p>
            <button id="start-btn">PLAY GAME</button>
        </div>
        <div id="hud">
            <div class="task-ui">ITEM: <span id="count">0</span> / 5</div>
            <div class="stamina-box"><div id="stamina-bar"></div></div>
        </div>
    </div>
    
    <div id="joy-container"><div id="joy-stick"></div></div>
    <div id="actions">
        <div id="btn-box">📦 BOX</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
