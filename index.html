<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Friends Ultimate FIX</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
        canvas { display: block; }
        
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 300; }
        #start-btn { padding: 20px 40px; font-size: 20px; background: red; color: white; border: none; font-weight: bold; border-radius: 10px; cursor: pointer; }

        #dialogue-box {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 600px; background: rgba(10, 10, 30, 0.95);
            border: 3px solid #00aaff; border-radius: 10px; padding: 15px;
            display: none; z-index: 200; cursor: pointer;
        }

        .hud { position: absolute; top: 10px; left: 10px; z-index: 10; pointer-events: none; }
        .box-ui { background: rgba(0,0,0,0.8); border-left: 5px solid red; padding: 10px; margin-bottom: 5px; }
        #stamina-bar { width: 100px; height: 8px; background: #333; margin-top: 5px; }
        #stamina-fill { width: 100%; height: 100%; background: #00ff00; }

        #joystick-area { position: absolute; bottom: 40px; left: 40px; width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 50; }
        #joystick-knob { position: absolute; top: 30px; left: 30px; width: 40px; height: 40px; background: rgba(255,255,255,0.4); border-radius: 50%; }
        .action-btns { position: absolute; bottom: 30px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
        .m-btn { width: 60px; height: 60px; background: rgba(255,255,255,0.2); border: 2px solid #fff; border-radius: 50%; color: #fff; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="overlay">
        <h1 style="color: red;">RAINBOW FRIENDS</h1>
        <button id="start-btn">MULAI PETUALANGAN</button>
    </div>

    <div id="dialogue-box">
        <div id="tech-name" style="font-weight:bold; color:#00aaff;">THE TECHNICIAN</div>
        <div id="tech-text">Mempersiapkan...</div>
        <div style="font-size: 10px; color: #0f0; margin-top: 10px;">KLIK UNTUK LANJUT</div>
    </div>

    <div class="hud">
        <div class="box-ui">
            <div id="info-ch" style="font-size: 10px;">CHAPTER 1</div>
            <div id="info-task" style="font-weight: bold; color: yellow;">CARI BLOK</div>
            <div id="info-count">ITEM: 0 / 5</div>
        </div>
        <div class="box-ui"><div id="stamina-bar"><div id="stamina-fill"></div></div></div>
    </div>

    <div id="joystick-area"><div id="joystick-knob"></div></div>
    <div class="action-btns">
        <div class="m-btn" id="btn-run">RUN</div>
        <div class="m-btn" id="btn-crouch">JONGKOK</div>
        <div class="m-btn" id="btn-box">BOX</div>
    </div>

    <canvas id="mainCanvas"></canvas>

<script>
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const joy = { active: false, dx: 0, dy: 0 };
let mRun = false, mBox = false, mCrouch = false;
const keys = {};

const LEVELS = [
    { ch: 1, speaker: "RED", task: "Cari Blok", goal: 5, mons: ["BLUE"], col: "#00f", msg: "Cari blok biru di sekitar sini!" },
    { ch: 2, speaker: "TECHNICIAN", task: "Bola Lampu", goal: 8, mons: ["BLUE", "CYAN"], col: "#ff0", msg: "Taman ini gelap, cari bola lampu!" }
];

class Player {
    constructor() {
        this.x = 500; // Posisi awal diperbaiki agar tidak di tengah antah berantah
        this.y = 500;
        this.stamina = 100;
        this.collected = 0;
    }
    update() {
        this.isHiding = mBox || keys['Space'];
        this.isCrouch = mCrouch || keys['KeyC'];
        if(this.isHiding) return;
        let s = this.isCrouch ? 2 : (mRun || keys['ShiftLeft'] ? 7 : 4);
        this.x += (joy.dx || (keys['KeyD']?1:0) - (keys['KeyA']?1:0)) * s;
        this.y += (joy.dy || (keys['KeyS']?1:0) - (keys['KeyW']?1:0)) * s;
        if(s > 5) this.stamina -= 0.4; else if(this.stamina < 100) this.stamina += 0.2;
        document.getElementById('stamina-fill').style.width = this.stamina + "%";
    }
}

class Monster {
    constructor(type) {
        this.type = type;
        this.x = Math.random() * 800 + 100;
        this.y = Math.random() * 800 + 100;
    }
    update(p) {
        let d = Math.hypot(p.x - this.x, p.y - this.y);
        if(d < 400 && !p.isHiding) {
            let ang = Math.atan2(p.y - this.y, p.x - this.x);
            this.x += Math.cos(ang) * 3;
            this.y += Math.sin(ang) * 3;
            if(d < 40) location.reload();
        }
    }
}

const game = {
    lvl: -1, active: false, player: new Player(), monsters: [], items: [],
    nextLevel() {
        this.lvl++;
        if(this.lvl >= LEVELS.length) { alert("TAMAT!"); location.reload(); return; }
        this.active = false;
        const d = LEVELS[this.lvl];
        const db = document.getElementById('dialogue-box');
        db.style.display = 'block';
        document.getElementById('tech-name').innerText = d.speaker;
        document.getElementById('tech-text').innerText = d.msg;
        db.onclick = () => { db.style.display = 'none'; this.startLevel(); };
    },
    startLevel() {
        const d = LEVELS[this.lvl];
        this.player.x = 500; this.player.y = 500;
        this.monsters = d.mons.map(m => new Monster(m));
        // Item diletakkan di sekitar pemain (jarak 100-1000) agar terlihat
        this.items = Array.from({length: d.goal}, () => ({
            x: Math.random() * 1000, 
            y: Math.random() * 1000, 
            c: false
        }));
        this.player.collected = 0;
        document.getElementById('info-ch').innerText = "CHAPTER " + d.ch;
        document.getElementById('info-task').innerText = d.task;
        document.getElementById('info-count').innerText = "ITEM: 0 / " + d.goal;
        this.active = true;
    },
    loop() {
        if(this.active) {
            ctx.fillStyle = "#111"; // Background abu gelap agar terlihat ada "lantai"
            ctx.fillRect(0,0,canvas.width,canvas.height);
            
            const cx = this.player.x - canvas.width/2;
            const cy = this.player.y - canvas.height/2;

            this.player.update();
            
            // Gambar Item
            this.items.forEach(it => {
                if(!it.c) {
                    ctx.fillStyle = LEVELS[this.lvl].col;
                    ctx.fillRect(it.x - cx, it.y - cy, 30, 30);
                    if(Math.hypot(this.player.x - it.x, this.player.y - it.y) < 50) {
                        it.c = true; this.player.collected++;
                        document.getElementById('info-count').innerText = "ITEM: " + this.player.collected + " / " + LEVELS[this.lvl].goal;
                    }
                }
            });

            // Gambar Monster
            this.monsters.forEach(m => {
                m.update(this.player);
                ctx.fillStyle = m.type.toLowerCase();
                ctx.beginPath(); ctx.arc(m.x - cx, m.y - cy, 30, 0, Math.PI*2); ctx.fill();
            });

            // Gambar Pemain
            ctx.fillStyle = this.player.isHiding ? "#553311" : "#0f0";
            ctx.beginPath(); ctx.arc(canvas.width/2, canvas.height/2, 20, 0, Math.PI*2); ctx.fill();

            if(this.player.collected >= LEVELS[this.lvl].goal) this.nextLevel();
        }
        requestAnimationFrame(() => this.loop());
    }
};

// Event Mulai
document.getElementById('start-btn').onclick = () => {
    document.getElementById('overlay').style.display = 'none';
    game.nextLevel();
};

// Event Kontrol Mobile
joyArea.ontouchstart = () => joy.active = true;
window.ontouchmove = e => {
    if(!joy.active) return;
    let t = e.touches[0], r = joyArea.getBoundingClientRect();
    let dx = t.clientX - (r.left + 50), dy = t.clientY - (r.top + 50);
    let d = Math.min(40, Math.hypot(dx, dy));
    let ang = Math.atan2(dy, dx);
    joy.dx = Math.cos(ang) * (d/40); joy.dy = Math.sin(ang) * (d/40);
    document.getElementById('joystick-knob').style.transform = `translate(${Math.cos(ang)*d}px, ${Math.sin(ang)*d}px)`;
};
window.ontouchend = () => { joy.active = false; joy.dx = 0; joy.dy = 0; document.getElementById('joystick-knob').style.transform = 'translate(0,0)'; };

document.getElementById('btn-run').ontouchstart = (e) => { e.preventDefault(); mRun = true; };
document.getElementById('btn-run').ontouchend = () => mRun = false;
document.getElementById('btn-crouch').ontouchstart = (e) => { e.preventDefault(); mCrouch = true; };
document.getElementById('btn-crouch').ontouchend = () => mCrouch = false;
document.getElementById('btn-box').ontouchstart = (e) => { e.preventDefault(); mBox = true; };
document.getElementById('btn-box').ontouchend = () => mBox = false;

window.onkeydown = e => keys[e.code] = true;
window.onkeyup = e => keys[e.code] = false;

game.loop();
</script>
</body>
</html>
